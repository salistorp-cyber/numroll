<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NumRoll">
<meta name="theme-color" content="#0a0a0f">
<title>NumRoll</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:'Outfit',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
html,body{
  background:#0a0a0f;
  color:#e0e0e0;
  font-family:'Outfit',sans-serif;
  height:100%;
  height:100dvh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
body{
  max-width:480px;
  margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0);
  background:linear-gradient(145deg,#0a0a0f 0%,#12121f 50%,#0d0d18 100%);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}

/* header */
.header{display:flex;justify-content:space-between;align-items:center;padding:max(16px,calc(env(safe-area-inset-top,0px) + 12px)) 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:18px;letter-spacing:3px;background:linear-gradient(135deg,#00e676,#00b0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:4px}
.nav button{background:rgba(255,255,255,.05);border:none;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;transition:all .2s}
.nav button.active{background:rgba(0,230,118,.15);box-shadow:0 0 12px rgba(0,230,118,.2)}

/* switcher */
.switcher-bar{padding:8px 20px}
.switcher-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;transition:all .2s}
.switcher-dot{width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 6px rgba(0,230,118,.5);flex-shrink:0}
.switcher-name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switcher-arrow{font-size:10px;color:#666}

/* picker overlay */
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:100px}
.picker-panel{width:90%;max-width:400px;background:#16162a;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;max-height:60vh;overflow-y:auto}
.picker-header{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#888;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
.picker-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.picker-row.active{background:rgba(0,230,118,.05);border-radius:8px;padding:4px 8px;margin:0 -8px}
.picker-name-btn{flex:1;background:none;border:none;color:#ddd;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;text-align:left;cursor:pointer;padding:8px 4px;display:flex;align-items:center;gap:8px}
.active-mark{color:#00e676;font-size:10px}
.picker-count{margin-left:auto;font-size:11px;color:#555;font-family:'JetBrains Mono',monospace}
.picker-action{background:none;border:none;font-size:14px;cursor:pointer;padding:6px 4px;opacity:.5;transition:opacity .2s}
.picker-action:hover{opacity:1}
.add-tracker-btn{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px dashed rgba(0,230,118,.3);background:rgba(0,230,118,.05);color:#00e676;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px}
.rename-row,.new-input-row{display:flex;gap:6px;flex:1;align-items:center;padding:4px 0}
.new-input-row{margin-top:10px}
.rename-input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid rgba(0,230,118,.3);background:rgba(0,0,0,.3);color:#fff;font-size:14px;font-family:'Outfit',sans-serif;outline:none}
.rename-save{background:rgba(0,230,118,.2);border:none;color:#00e676;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px}
.rename-cancel{background:rgba(255,255,255,.05);border:none;color:#888;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:14px}
.delete-confirm{display:flex;gap:8px;flex:1;align-items:center;padding:6px 0}
.delete-text{flex:1;font-size:13px;color:#ff1744;font-weight:500}
.delete-yes{background:rgba(255,23,68,.2);border:none;color:#ff1744;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.delete-no{background:rgba(255,255,255,.05);border:none;color:#888;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}

/* roll view */
.roll-view{padding:20px 20px 0;text-align:center;flex:1;overflow-y:auto}
.target-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.target-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:#888;font-weight:600}
.target-num{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:800;color:#fff}
.range-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:#555}

.roll-circle{
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#1a1a2e 0%,#0f0f1a 100%);
  border:2px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 24px;cursor:pointer;transition:all .3s ease;
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.05);
  user-select:none;-webkit-user-select:none;
}
.roll-circle.hit{border-color:#00e676;box-shadow:0 0 40px rgba(0,230,118,.25),inset 0 0 20px rgba(0,230,118,.05)}
.roll-circle.miss{border-color:#ff1744;box-shadow:0 0 40px rgba(255,23,68,.25),inset 0 0 20px rgba(255,23,68,.05)}
.roll-circle.spinning{animation:spin .6s cubic-bezier(.5,0,.5,1)}
.roll-number{font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:800;color:#fff;line-height:1}
.roll-instruction{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#555;margin-top:8px}

.result-badge{
  display:inline-block;padding:8px 20px;border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#000;margin-bottom:24px;
  animation:popIn .3s ease;
}

.quick-stats{display:flex;justify-content:center;gap:32px;margin-bottom:20px}
.qs-item{text-align:center}
.qs-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:#fff}
.qs-label{font-size:11px;color:#666;letter-spacing:1px;margin-top:2px}

.adjust-info{
  font-size:12px;color:#555;padding:12px 16px;
  background:rgba(255,255,255,.03);border-radius:8px;
  font-family:'JetBrains Mono',monospace;
}

/* history */
.hist-view{padding:16px 20px;flex:1;overflow-y:auto}
.period-tabs{display:flex;gap:6px;margin-bottom:20px}
.period-btn{flex:1;padding:8px 0;border:1px solid rgba(255,255,255,.08);background:transparent;color:#888;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s}
.period-btn.active{background:rgba(0,230,118,.12);color:#00e676;border-color:rgba(0,230,118,.3)}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:rgba(255,255,255,.03);border-radius:10px;padding:14px 12px;text-align:center;border:1px solid rgba(255,255,255,.04)}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:800;color:#fff}
.stat-lbl{font-size:11px;color:#666;margin-top:4px;letter-spacing:1px}

.bar-viz{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:20px;background:rgba(255,255,255,.03)}
.bar-viz .bar{height:100%;transition:width .4s ease}

.log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#888;letter-spacing:1px}
.clear-btn{background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.3);color:#ff1744;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.log-list{max-height:340px;overflow-y:auto}
.empty-log{text-align:center;color:#444;padding:30px;font-family:'JetBrains Mono',monospace;font-size:13px}
.log-row{padding:10px 12px;margin-bottom:6px;background:rgba(255,255,255,.02);border-radius:8px}
.log-main{display:flex;align-items:center;gap:8px}
.log-result{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800}
.log-vs{font-size:11px;color:#555}
.log-target{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#888}
.log-badge{margin-left:auto;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px}
.log-time{font-size:10px;color:#444;margin-top:4px}

/* settings */
.settings-view{padding:20px;flex:1;overflow-y:auto}
.settings-title{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;margin-bottom:20px;letter-spacing:1px;color:#fff}
.sub-title{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;margin-bottom:14px;color:#00e676;letter-spacing:1px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#888;margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.field input[type=number]{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-size:16px;font-family:'JetBrains Mono',monospace;outline:none}
.target-control{display:flex;gap:8px;align-items:center}
.target-control input{text-align:center;flex:1}
.pm-btn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:22px;cursor:pointer;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center}
.toggle-row{display:flex;gap:8px}
.toggle-btn{flex:1;padding:10px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:transparent;color:#888;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s}
.toggle-btn.active{background:rgba(0,230,118,.12);color:#00e676;border-color:rgba(0,230,118,.3)}
.divider{height:1px;background:rgba(255,255,255,.06);margin:20px 0}
.reset-btn{width:100%;padding:12px;border-radius:8px;border:none;background:rgba(0,176,255,.15);color:#00b0ff;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;margin-bottom:8px}
.reset-btn.danger{background:rgba(255,23,68,.15);color:#ff1744}
.install-note{margin-top:24px;padding:14px 16px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:12px;color:#888;line-height:1.6;font-family:'JetBrains Mono',monospace}

/* habits */
.habits-view{padding:16px 20px;flex:1;overflow-y:auto}
.balance-card{text-align:center;padding:22px 20px 14px;background:rgba(255,255,255,.03);border-radius:14px;border:1px solid rgba(255,255,255,.06);margin-bottom:20px;transition:border-color .2s}
.balance-card:hover{border-color:rgba(255,255,255,.12)}
.balance-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:#555;margin-bottom:8px}
.balance-amt{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:800;line-height:1}
.balance-today{font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:8px}
.habit-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:8px;transition:all .15s}
.habit-check{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.habit-del{background:none;border:none;cursor:pointer;font-size:14px;opacity:.2;transition:opacity .2s;padding:4px;color:#fff;flex-shrink:0}
.habit-del:hover{opacity:.8}
.habit-section-hd{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:#555;font-weight:700;margin:20px 0 10px;text-transform:uppercase}
.habit-log-row{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.02);margin-bottom:5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-left:3px solid transparent}

/* mandarin */
.man-view{padding:0;flex:1;min-height:0;overflow:hidden}

.hidden{display:none!important}

@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">NUMROLL</div>
  <div class="nav">
    <button id="nav-roll" class="active" onclick="switchView('roll')">🎲</button>
    <button id="nav-history" onclick="switchView('history')">📊</button>
    <button id="nav-mandarin" onclick="switchView('mandarin')" title="Mandarin">🀄</button>
    <button id="nav-habits" onclick="switchView('habits')" title="Habit $">💰</button>
    <button id="nav-settings" onclick="switchView('settings')">⚙️</button>
  </div>
</div>

<div class="switcher-bar">
  <button class="switcher-btn" onclick="togglePicker()">
    <span class="switcher-dot"></span>
    <span class="switcher-name" id="switcher-name">My Tracker</span>
    <span class="switcher-arrow" id="switcher-arrow">▼</span>
  </button>
</div>

<div id="picker-overlay" class="picker-overlay hidden" onclick="closePicker()">
  <div class="picker-panel" onclick="event.stopPropagation()">
    <div class="picker-header">Your Trackers</div>
    <div id="picker-list"></div>
    <div id="new-input-row" class="new-input-row hidden">
      <input id="new-name-input" class="rename-input" placeholder="Tracker name…"
        onkeydown="if(event.key==='Enter')confirmNewTracker()">
      <button class="rename-save" onclick="confirmNewTracker()">✓</button>
      <button class="rename-cancel" onclick="cancelNewTracker()">✕</button>
    </div>
    <button id="add-tracker-btn" class="add-tracker-btn" onclick="showNewTrackerInput()">+ New Tracker</button>
  </div>
</div>


<!-- ROLL VIEW -->
<div id="view-roll" class="roll-view">
  <div class="target-bar">
    <span class="target-label">TARGET</span>
    <span class="target-num" id="target-num">50</span>
    <span class="range-label" id="range-label">1–100</span>
  </div>
  <div class="roll-circle" id="roll-circle" onclick="doRoll()">
    <div class="roll-number" id="roll-number">?</div>
    <div class="roll-instruction" id="roll-instruction">TAP TO ROLL</div>
  </div>
  <div id="result-badge" class="result-badge hidden"></div>
  <div class="quick-stats">
    <div class="qs-item"><div class="qs-val" id="qs-total">0</div><div class="qs-label">Rolls</div></div>
    <div class="qs-item"><div class="qs-val" id="qs-hits">0</div><div class="qs-label">Hits</div></div>
    <div class="qs-item"><div class="qs-val" id="qs-rate">0%</div><div class="qs-label">Rate</div></div>
  </div>
  <div class="adjust-info" id="adjust-info"></div>
</div>

<!-- HISTORY VIEW -->
<div id="view-history" class="hist-view hidden">
  <div class="period-tabs" id="period-tabs"></div>
  <div class="stats-grid" id="stats-grid"></div>
  <div class="bar-viz" id="bar-viz"></div>
  <div class="log-header">
    <span>Roll Log</span>
    <div style="display:flex;gap:6px">
      <button class="clear-btn" style="background:rgba(0,176,255,.1);border-color:rgba(0,176,255,.3);color:#00b0ff" onclick="exportHistory()">Export CSV</button>
      <button class="clear-btn" onclick="clearHistory()">Clear All</button>
    </div>
  </div>
  <div class="log-list" id="log-list"></div>
</div>

<!-- SETTINGS VIEW -->
<div id="view-settings" class="settings-view hidden"></div>

<!-- HABITS VIEW -->
<div id="view-habits" class="habits-view hidden"></div>

<!-- MANDARIN VIEW -->
<div id="view-mandarin" class="man-view hidden">
  <iframe id="mandarin-iframe" src="./mandarin/index.html" style="width:100%;height:100%;border:none;display:block" loading="lazy" allow="microphone"></iframe>
</div>

<script>
// ── State ──
const STORAGE_KEY = "numroll-data-v2";
const DEFAULT_CFG = { target:50, min:1, max:100, direction:"up", adjustAmount:1, rollsBeforeRaise:1 };
const MAX_HISTORY = 1000;

let data = { trackers: [], activeId: null };
let currentView = "roll";
let statsPeriod = "day";
let rolling = false;
let lastRoll = null;
let showResult = false;
let animInterval = null;
let rollAdjustToken = 0;

// ── Helpers ──
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const startOfWeek = d => { const s = startOfDay(d); s.setDate(s.getDate()-s.getDay()); return s; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);

function filterByPeriod(rolls, period) {
  if (period==="all") return rolls;
  const n = new Date();
  let cutoff;
  if (period==="day") cutoff=startOfDay(n);
  else if (period==="week") cutoff=startOfWeek(n);
  else cutoff=startOfMonth(n);
  return rolls.filter(r => new Date(r.ts)>=cutoff);
}

function getStats(rolls) {
  if (!rolls.length) return {total:0,hits:0,misses:0,rate:0};
  const hits = rolls.filter(r=>r.hit).length;
  return {total:rolls.length, hits, misses:rolls.length-hits, rate:Math.round(hits/rolls.length*100)};
}

function secureRandom(min,max) {
  if (min>max) return min;
  const range=max-min+1;
  // If range >= 2^32, limit would be 0, causing an infinite loop — use Math.random fallback.
  if (range >= 0x100000000) return min + Math.floor(Math.random() * range);
  const limit=Math.floor(0x100000000/range)*range;
  let raw;
  do { raw=crypto.getRandomValues(new Uint32Array(1))[0]; } while(raw>=limit);
  return min+(raw%range);
}

function makeTracker(name) {
  return { id:uid(), name, cfg:{...DEFAULT_CFG}, history:[], archived:false };
}

// ── Storage ──
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.trackers && d.trackers.length) return d; }
  } catch(e) {}
  const init = { trackers:[makeTracker("My Tracker")], activeId:null };
  init.activeId = init.trackers[0].id;
  return init;
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

// ── Active tracker ──
function tracker() { return data.trackers.find(t=>t.id===data.activeId) || data.trackers[0]; }
function cfg() { return tracker()?.cfg || DEFAULT_CFG; }
function history() { return tracker()?.history || []; }

// ── View switching ──
function switchView(v) {
  currentView = v;
  closePicker();
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  document.getElementById('view-roll').classList.toggle('hidden', v!=='roll');
  document.getElementById('view-history').classList.toggle('hidden', v!=='history');
  document.getElementById('view-settings').classList.toggle('hidden', v!=='settings');
  document.getElementById('view-habits').classList.toggle('hidden', v!=='habits');
  document.getElementById('view-mandarin').classList.toggle('hidden', v!=='mandarin');
  updateSwitcherBar(v);
  if (v==='roll') renderRoll();
  else if (v==='history') renderHistory();
  else if (v==='settings') renderSettings();
  else if (v==='habits') renderHabits();
}

// ── Picker ──
function togglePicker() {
  const el = document.getElementById('picker-overlay');
  el.classList.toggle('hidden');
  document.getElementById('switcher-arrow').textContent = el.classList.contains('hidden') ? '▼' : '▲';
  if (!el.classList.contains('hidden')) renderPicker();
}
function closePicker() {
  document.getElementById('picker-overlay').classList.add('hidden');
  document.getElementById('switcher-arrow').textContent = '▼';
}

function renderPicker() {
  const list = document.getElementById('picker-list');
  const active   = data.trackers.filter(t => !t.archived);
  const archived = data.trackers.filter(t => t.archived);

  const activeRow = t => `
    <div class="picker-row ${t.id===data.activeId?'active':''}">
      <button class="picker-name-btn" data-id="${t.id}" data-action="switch">
        ${t.id===data.activeId?'<span class="active-mark">●</span>':''}
        ${esc(t.name)}
        <span class="picker-count">${t.history.length} rolls</span>
      </button>
      <button class="picker-action" data-id="${t.id}" data-action="rename" title="Rename">✏️</button>
      <button class="picker-action" data-id="${t.id}" data-action="archive" title="Archive">📥</button>
      <button class="picker-action" data-id="${t.id}" data-action="delete" title="Delete">🗑️</button>
    </div>`;

  // Archived trackers are treated as completed: viewable, but no delete — recover first to delete.
  const archivedRow = t => `
    <div class="picker-row ${t.id===data.activeId?'active':''}" style="opacity:.7">
      <button class="picker-name-btn" data-id="${t.id}" data-action="switch">
        ${t.id===data.activeId?'<span class="active-mark">●</span>':''}
        🔒 ${esc(t.name)}
        <span class="picker-count">${t.history.length} rolls</span>
      </button>
      <button class="picker-action" data-id="${t.id}" data-action="recover" title="Recover">♻️</button>
    </div>`;

  let html = active.map(activeRow).join('');
  if (archived.length) {
    html += `<div class="picker-header" style="margin-top:14px;color:#666">Archived (completed)</div>`;
    html += archived.map(archivedRow).join('');
  }
  list.innerHTML = html;

  list.onclick = e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action==='switch') switchTracker(id);
    else if (action==='rename') startRename(id);
    else if (action==='archive') archiveTracker(id);
    else if (action==='recover') recoverTracker(id);
    else if (action==='delete') confirmDeleteTracker(id);
  };
  document.getElementById('new-input-row').classList.add('hidden');
  document.getElementById('add-tracker-btn').classList.remove('hidden');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function switchTracker(id) {

function startRename(id) {
  const t = data.trackers.find(t=>t.id===id);
  if (!t) return;
  const list = document.getElementById('picker-list');

  const t = data.trackers.find(t=>t.id===id);
  if (t) t.name = val;
  saveData(); renderPicker(); renderAll();
}

function confirmDeleteTracker(id) {
  const t = data.trackers.find(t=>t.id===id);
  if (!t) return;
  const list = document.getElementById('picker-list');
  const row = [...list.children].find(r => r.querySelector(`[data-id="${id}"]`));

  label.textContent = `Delete "${t.name}"?`;

}

function archiveTracker(id) {
  const t = data.trackers.find(t=>t.id===id);
  if (!t) return;
  t.archived = true;
  // The active tracker must stay un-archived (rolling is disabled on archived ones).
  if (data.activeId === id) {
    const next = data.trackers.find(t=>!t.archived);
    if (next) data.activeId = next.id;
    else { const nt = makeTracker("My Tracker"); data.trackers.push(nt); data.activeId = nt.id; }
  }
  lastRoll=null; showResult=false;
  saveData(); renderPicker(); renderAll();
}

function recoverTracker(id) {
  const t = data.trackers.find(t=>t.id===id);
  if (!t) return;
  t.archived = false;
  saveData(); renderPicker(); renderAll();
}

function deleteTracker(id) {
  const t = data.trackers.find(t=>t.id===id);
  // Archived trackers are protected: must be recovered before they can be deleted.
  if (t && t.archived) { renderPicker(); return; }
  data.trackers = data.trackers.filter(t=>t.id!==id);
  if (!data.trackers.length) { const t=makeTracker("My Tracker"); data.trackers=[t]; data.activeId=t.id; }
  else if (data.activeId===id) data.activeId=data.trackers[0].id;
  lastRoll=null; showResult=false;
  saveData(); renderPicker(); renderAll();
}

// ── Rolling ──
function doRoll() {
  if (rolling) return;
  if (tracker()?.archived) return; // archived = completed, read-only
  const c = cfg();
  // Capture tracker ID now so the result is logged to the right tracker even if the
  // user switches trackers during the 600 ms animation window.
  const capturedTrackerId = data.activeId;
  showResult = false;
  rolling = true;
  const circle = document.getElementById('roll-circle');
  circle.className = 'roll-circle spinning';
  document.getElementById('roll-instruction').textContent = 'ROLLING…';
  document.getElementById('result-badge').classList.add('hidden');

  animInterval = setInterval(() => {
    document.getElementById('roll-number').textContent = Math.floor(Math.random() * (c.max - c.min + 1)) + c.min;
  }, 50);

  const myToken = ++rollAdjustToken;
  setTimeout(() => {
    clearInterval(animInterval);
    const result = secureRandom(c.min, c.max);
    const hit = result >= c.target;
    const entry = { result, target:c.target, hit, ts:new Date().toISOString() };
    const t = data.trackers.find(tr=>tr.id===capturedTrackerId) || tracker();
    t.history.unshift(entry);
    if (t.history.length > MAX_HISTORY) t.history.length = MAX_HISTORY;
    lastRoll = entry;
    rolling = false;
    showResult = true;
    saveData();
    renderRoll();

    // check adjust — token guards against a second roll firing before this runs
    const newTarget = checkAdjust(t.history, c);
    if (newTarget !== c.target) {
      setTimeout(() => {
        if (rollAdjustToken !== myToken) return;
        const t2 = data.trackers.find(tr=>tr.id===capturedTrackerId);
        if (t2) { t2.cfg.target = newTarget; saveData(); renderRoll(); }
      }, 800);
    }
  }, 600);
}

function checkAdjust(rolls, c) {
  const n = c.rollsBeforeRaise ?? 1;
  const recent = rolls.filter(r => r.target === c.target).slice(0, n);
  if (recent.length < n) return c.target;
  if (recent.every(r => r.hit)) {
    return c.direction==="up" ? Math.min(c.max, c.target+c.adjustAmount) : Math.max(c.min, c.target-c.adjustAmount);
  }
  return c.target;
}

function updateCfg(key, val) {
  const c = tracker().cfg;
  if (key === 'direction') { c[key] = val; saveData(); renderAll(); return; }
  val = +val;
  if (isNaN(val)) return;
  if (key === 'min' || key === 'max' || key === 'target') val = Math.floor(val);
  if (key === 'adjustAmount') val = Math.max(1, Math.floor(val));
  if (key === 'rollsBeforeRaise') val = Math.max(1, Math.floor(val));
  c[key] = val;
  // Cross-validate: keep min <= max and target clamped within range
  if (c.min > c.max) { if (key === 'min') c.min = c.max; else c.max = c.min; }
  c.target = Math.max(c.min, Math.min(c.max, c.target));
  saveData(); renderAll();
}

// ── Habit $ Tracker ──
const HABIT_KEY = "numroll-habits-v1";
const HABIT_LOG_DAYS   = 365; // 1 year — ~150 KB max, trivial
const HABIT_DAILY_DAYS = 90;  // keep per-day check states for 90 days (past editing)

let habitData = { habits:[], initialBalance:0, todayChecked:{}, lastDate:'', log:[], dailyChecked:{}, todayTimes:{}, dailyTimes:{} };
let habitShowAdd     = false;
let habitFormType    = 'do';
let habitEditBalance = false;
let habitShowPast    = false;
let habitPastDate    = '';
let habitPastChecked = {};

function fmtMoney(n) { return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2); }
function fmtTime(d) { let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0'); const ap=h<12?'AM':'PM'; h=h%12; if(h===0)h=12; return `${h}:${m} ${ap}`; }
function localDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function habitTodayStr() { return localDateStr(new Date()); }

// Balance is always computed from initialBalance + log sum so past edits propagate correctly
function habitBalance() {
  let cents = Math.round((habitData.initialBalance || 0) * 100);
  for (const e of habitData.log) cents += Math.round((e.delta || 0) * 100);
  return cents / 100;
}

function loadHabits() {
  try {
    const r = localStorage.getItem(HABIT_KEY);
    if (r) {
      const d = JSON.parse(r);
      habitData = { ...habitData, ...d };
      // Migrate: old data stored running total in 'balance', no 'initialBalance'
      if (typeof habitData.initialBalance === 'undefined') {
        let logSum = 0;
        for (const e of habitData.log) logSum += (e.delta || 0);
        habitData.initialBalance = Math.round(((habitData.balance || 0) - logSum) * 100) / 100;
      }
      if (!habitData.dailyChecked) habitData.dailyChecked = {};
      if (!habitData.todayTimes) habitData.todayTimes = {};
      if (!habitData.dailyTimes) habitData.dailyTimes = {};
    }
  } catch {}
  processHabitRollover();
}

function saveHabits() {
  try { localStorage.setItem(HABIT_KEY, JSON.stringify(habitData)); } catch {}
}

// Generate log entries for one day given a checked-state map
function habitDayEntries(date, checked, times) {
  const entries = [];
  for (const h of habitData.habits) {
    const done = !!checked[h.id];
    let delta = 0, reason = '';
    if (h.type === 'do') {
      reason = done ? `✓ Done: ${h.name}` : `✗ Missed: ${h.name}`;
      if (!done) delta = -h.amount;
    } else {
      reason = done ? `✗ Broke: ${h.name}` : `✓ Kept: ${h.name}`;
      delta = done ? -h.amount : +h.amount;
    }
    const tms = (times && times[h.id]) || [];
    entries.push({ date, reason, delta, times: tms.slice() });
  }
  return entries;
}

function habitTrimLog() {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - HABIT_LOG_DAYS);
  const cs = cutoff.toISOString().slice(0,10);
  habitData.log = habitData.log.filter(e => e.date >= cs);
  const dc = new Date(); dc.setDate(dc.getDate() - HABIT_DAILY_DAYS);
  const ds = dc.toISOString().slice(0,10);
  Object.keys(habitData.dailyChecked).forEach(d => { if (d < ds) delete habitData.dailyChecked[d]; });
  Object.keys(habitData.dailyTimes).forEach(d => { if (d < ds) delete habitData.dailyTimes[d]; });
}

function processHabitRollover() {
  const today = habitTodayStr();
  if (habitData.lastDate === today) return;

  if (habitData.lastDate && habitData.habits.length) {
    // Build ordered list: lastDate first, then any gap days up to yesterday
    const datesToProcess = [];
    let cursor = new Date(habitData.lastDate);
    const todayDate = new Date(today);
    while (cursor < todayDate) {
      datesToProcess.push(cursor.toISOString().slice(0,10));
      cursor.setDate(cursor.getDate() + 1);
    }
    // Process each: lastDate uses todayChecked, gap days use {} (missed)
    for (const date of datesToProcess) {
      const isLast = date === habitData.lastDate;
      const checked = isLast ? habitData.todayChecked : {};
      const times = isLast ? habitData.todayTimes : {};
      habitData.dailyChecked[date] = { ...checked };
      habitData.dailyTimes[date] = { ...times };
      const entries = habitDayEntries(date, checked, times);
      // Insert before existing entries for the same date, newest date first
      habitData.log.unshift(...entries.reverse()); // reverse so they unshift in correct order
    }
  }

  habitTrimLog();
  habitData.todayChecked = {};
  habitData.todayTimes = {};
  habitData.lastDate = today;
  saveHabits();
}

function habitTodayDelta() {
  let d = 0;
  for (const h of habitData.habits) {
    const checked = !!habitData.todayChecked[h.id];
    if      (h.type==='do'   && !checked) d -= h.amount;
    else if (h.type==='dont' &&  checked) d -= h.amount;
    else if (h.type==='dont' && !checked) d += h.amount;
  }
  return Math.round(d * 100) / 100;
}

function habitToggle(id) {
  const nowOn = !habitData.todayChecked[id];
  habitData.todayChecked[id] = nowOn;
  if (!habitData.todayTimes[id]) habitData.todayTimes[id] = [];
  if (nowOn) habitData.todayTimes[id].push(fmtTime(new Date()));
  else habitData.todayTimes[id] = []; // cleared when unchecked
  saveHabits();
  // Full re-render so the recorded timestamps and projected balance update together
  renderHabits();
}

function habitDelete(id) {
  const row = document.getElementById('hrow-'+id);
  if (row && !row.dataset.confirmDelete) {
    row.dataset.confirmDelete = '1';
    const del = row.querySelector('.habit-del');
    if (del) { del.textContent='Confirm?'; del.style.opacity='1'; del.style.color='#ff1744'; }
    setTimeout(() => { if(row){delete row.dataset.confirmDelete;} if(del){del.textContent='🗑️';del.style.opacity='.2';del.style.color='#fff';} }, 2000);
    return;
  }
  habitData.habits = habitData.habits.filter(h=>h.id!==id);
  delete habitData.todayChecked[id];
  saveHabits(); renderHabits();
}

function habitFormTypeSelect(t) { habitFormType=t; renderHabits(); }

function habitAddConfirm() {
  const name = (document.getElementById('habit-name-inp')?.value||'').trim();
  const amt  = parseFloat(document.getElementById('habit-amt-inp')?.value);
  if (!name || isNaN(amt) || amt < 0) return;
  habitData.habits.push({ id:uid(), name, type:habitFormType, amount:amt });
  habitShowAdd = false;
  saveHabits(); renderHabits();
}

function habitSetBalance() {
  const val = parseFloat(document.getElementById('habit-bal-inp')?.value);
  if (!isNaN(val)) habitData.initialBalance = Math.round(val * 100) / 100;
  habitEditBalance = false;
  saveHabits(); renderHabits();
}

// Past-day editing
function habitOpenPast() {
  habitShowPast = true;
  const d = new Date(); d.setDate(d.getDate()-1);
  habitPastDate = localDateStr(d);
  habitPastChecked = { ...(habitData.dailyChecked[habitPastDate] || {}) };
  renderHabits();
}
function habitPastNav(offset) {
  const parts = habitPastDate.split('-');
  const d = new Date(+parts[0], +parts[1]-1, +parts[2]); d.setDate(d.getDate()+offset);
  const s = localDateStr(d);
  const min = new Date(); min.setDate(min.getDate()-HABIT_DAILY_DAYS);
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if (s < localDateStr(min) || s > localDateStr(yesterday)) return;
  habitPastDate = s;
  habitPastChecked = { ...(habitData.dailyChecked[habitPastDate] || {}) };
  renderHabits();
}
function habitPastToggle(id) { habitPastChecked[id]=!habitPastChecked[id]; renderHabits(); }
function habitSavePastDay() {
  // Remove old log entries for this date, insert fresh ones
  habitData.log = habitData.log.filter(e => e.date !== habitPastDate);
  const entries = habitDayEntries(habitPastDate, habitPastChecked, habitData.dailyTimes[habitPastDate] || {});
  habitData.log.push(...entries);
  habitData.log.sort((a,b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  habitTrimLog();
  habitData.dailyChecked[habitPastDate] = { ...habitPastChecked };
  habitShowPast = false;
  saveHabits(); renderHabits();
}

function exportHabitLog() {
  if (!habitData.log.length) return;
  const header = 'date,delta,reason,times\n';
  const body = habitData.log
    .map(e => `${e.date},${(e.delta||0).toFixed(2)},"${(e.reason||'').replace(/"/g,'""')}","${(e.times||[]).join('; ').replace(/"/g,'""')}"`)
    .join('\n');
  const blob = new Blob([header+body], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `numroll_habits_${habitTodayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function renderHabits() {
  const el = document.getElementById('view-habits');
  if (!el) return;
  const base         = habitBalance();
  const todayDelta   = habitTodayDelta();
  const projBalance  = Math.round((base + todayDelta) * 100) / 100;
  const balColor     = projBalance >= 0 ? '#00e676' : '#ff1744';
  const deltaColor   = todayDelta  >= 0 ? '#00e676' : '#ff1744';
  const deltaSign    = todayDelta  > 0 ? '+' : '';

  let html = '';

  // ── Balance card ──
  if (habitEditBalance) {
    html += `<div class="balance-card">
      <div class="balance-label">STARTING BALANCE</div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:28px;color:#888">$</span>
        <input id="habit-bal-inp" type="number" step="0.01" value="${habitData.initialBalance}"
          style="width:160px;padding:10px 12px;border-radius:8px;border:1px solid rgba(0,230,118,.4);background:rgba(0,0,0,.3);color:#fff;font-size:28px;font-family:'JetBrains Mono',monospace;font-weight:800;text-align:center;outline:none"
          onkeydown="if(event.key==='Enter')habitSetBalance()">
      </div>
      <div style="font-size:11px;color:#555;font-family:'JetBrains Mono',monospace;margin-top:8px">Base value before any tracked days</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
        <button onclick="habitSetBalance()" style="padding:7px 20px;font-size:12px;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono',monospace;border:none;background:#e0e0e0;color:#0a0a0f;font-weight:700;letter-spacing:.5px">SAVE</button>
        <button onclick="habitEditBalance=false;renderHabits()" style="padding:7px 16px;font-size:12px;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono',monospace;border:1px solid rgba(255,255,255,.1);background:transparent;color:#888">Cancel</button>
      </div>
    </div>`;
  } else {
    html += `<div class="balance-card" onclick="habitEditBalance=true;renderHabits()" style="cursor:pointer">
      <div class="balance-label">BALANCE</div>
      <div class="balance-amt" style="color:${balColor}">${fmtMoney(projBalance)}</div>
      ${habitData.habits.length ? `<div class="balance-today" style="color:${deltaColor}">${deltaSign}${fmtMoney(todayDelta)} today (pending)</div>` : ''}
      <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#2a2a3a;margin-top:8px;letter-spacing:1px">TAP TO EDIT STARTING BALANCE</div>
    </div>`;
  }

  // ── Header row ──
  html += `<div class="log-header" style="margin-bottom:10px">
    <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#888;letter-spacing:1px">TODAY'S HABITS</span>
    <button class="clear-btn" style="background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.3);color:#00e676"
      onclick="habitShowAdd=!habitShowAdd;if(habitShowAdd)habitShowPast=false;renderHabits()">${habitShowAdd ? '✕ Cancel' : '+ Add Habit'}</button>
  </div>`;

  // ── Add habit form ──
  if (habitShowAdd) {
    html += `<div style="margin-bottom:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)">
      <div class="field"><label>Habit name</label>
        <input id="habit-name-inp" type="text" placeholder="e.g. Do pushups every day"
          style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-size:15px;font-family:'Outfit',sans-serif;outline:none"
          onkeydown="if(event.key==='Enter')habitAddConfirm()">
      </div>
      <div class="field"><label>Type</label>
        <div class="toggle-row">
          <button class="toggle-btn ${habitFormType==='do'?'active':''}" onclick="habitFormTypeSelect('do')">✓ DO this</button>
          <button class="toggle-btn ${habitFormType==='dont'?'active':''}" onclick="habitFormTypeSelect('dont')">✗ DON'T do this</button>
        </div>
        <div style="font-size:11px;color:#555;margin-top:7px;font-family:'JetBrains Mono',monospace;line-height:1.6">
          ${habitFormType==='do'
            ? 'Check off when done. <span style="color:#ff1744">Miss a day → lose $.</span>'
            : 'Check if you broke it. <span style="color:#ff1744">Broke it → lose $.</span> <span style="color:#00e676">Resisted → earn $.</span>'}
        </div>
      </div>
      <div class="field"><label>$ per day</label>
        <div class="target-control">
          <span class="pm-btn" style="font-size:18px;color:#888;font-family:'JetBrains Mono',monospace;cursor:default;display:flex;align-items:center;justify-content:center">$</span>
          <input id="habit-amt-inp" type="number" min="0" step="0.5" value="5" style="text-align:center;flex:1"
            onkeydown="if(event.key==='Enter')habitAddConfirm()">
          <button class="pm-btn" onclick="let i=document.getElementById('habit-amt-inp');i.value=Math.max(0,(+i.value||0)+1)">+</button>
        </div>
      </div>
      <button onclick="habitAddConfirm()" style="width:100%;padding:11px;border-radius:8px;border:none;background:rgba(0,230,118,.15);color:#00e676;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;margin-top:4px">ADD HABIT</button>
    </div>`;
  }

  // ── Empty state ──
  if (habitData.habits.length === 0 && !habitShowAdd) {
    html += `<div style="text-align:center;padding:2.5rem 2rem;border:1px dashed rgba(255,255,255,.08);border-radius:12px">
      <div style="font-size:32px;margin-bottom:.75rem">💰</div>
      <div style="font-size:14px;font-weight:500;color:#e0e0e0;margin-bottom:6px">No habits yet</div>
      <div style="font-size:13px;color:#888;margin-bottom:1.5rem">Add a DO habit (miss a day, lose $) or a DON'T habit (break it, lose $; resist, earn $).</div>
      <button onclick="habitShowAdd=true;renderHabits()" style="padding:8px 22px;font-size:13px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e0e0e0">Add first habit →</button>
    </div>`;
  } else {
    // ── Today's habit rows ──
    for (const h of habitData.habits) {
      const checked = !!habitData.todayChecked[h.id];
      const isDo = h.type === 'do';
      let checkBg, checkColor, checkText, rowBorder;
      if (isDo) {
        if (checked) { checkBg='#00e676'; checkColor='#0a0a0f'; checkText='✓'; rowBorder='rgba(0,230,118,.2)'; }
        else         { checkBg='rgba(255,255,255,.05)'; checkColor='#444'; checkText=''; rowBorder='rgba(255,255,255,.06)'; }
      } else {
        if (checked) { checkBg='#ff1744'; checkColor='#fff'; checkText='✗'; rowBorder='rgba(255,23,68,.25)'; }
        else         { checkBg='rgba(0,230,118,.07)'; checkColor='#00e676'; checkText='·'; rowBorder='rgba(0,230,118,.1)'; }
      }
      const badgeBg    = isDo ? 'rgba(0,176,255,.1)' : 'rgba(255,165,0,.1)';
      const badgeColor = isDo ? '#00b0ff' : '#ffa040';
      const note = isDo
        ? `miss: <span style="color:#ff1744">-${fmtMoney(h.amount)}</span>`
        : `break: <span style="color:#ff1744">-${fmtMoney(h.amount)}</span> · keep: <span style="color:#00e676">+${fmtMoney(h.amount)}</span>`;
      const times = habitData.todayTimes[h.id] || [];
      const timesLine = times.length
        ? `<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${isDo?'#00b0ff':'#ffa040'};margin-top:4px">🕐 ${times.map(esc).join(' · ')}</div>`
        : '';
      html += `<div id="hrow-${esc(h.id)}" class="habit-row" style="border:1px solid ${rowBorder}">
        <div class="habit-check" style="background:${checkBg};color:${checkColor};border:1px solid ${rowBorder}" onclick="habitToggle('${esc(h.id)}')">${checkText}</div>
        <div style="flex:1;min-width:0;cursor:pointer" onclick="habitToggle('${esc(h.id)}')">
          <div style="font-size:14px;font-weight:500;color:#e0e0e0">${esc(h.name)}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">
            <span style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:4px;background:${badgeBg};color:${badgeColor}">${isDo?'DO':"DON'T"}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#555">${note}</span>
          </div>
          ${timesLine}
        </div>
        <button class="habit-del" onclick="event.stopPropagation();habitDelete('${esc(h.id)}')">🗑️</button>
      </div>`;
    }
  }

  // ── Past day editor ──
  if (!habitShowPast) {
    if (habitData.log.length || habitData.habits.length) {
      html += `<button onclick="habitOpenPast()" style="width:100%;padding:10px;margin-top:12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:transparent;color:#555;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;letter-spacing:.5px">✏️ Edit a past day</button>`;
    }
  } else {
    const minPast = new Date(); minPast.setDate(minPast.getDate()-HABIT_DAILY_DAYS);
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    const canPrev = habitPastDate > localDateStr(minPast);
    const canNext = habitPastDate < localDateStr(yesterday);
    html += `<div style="margin-top:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button onclick="habitPastNav(-1)" style="padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:${canPrev?'rgba(255,255,255,.05)':'transparent'};color:${canPrev?'#e0e0e0':'#333'};cursor:${canPrev?'pointer':'default'};font-family:'JetBrains Mono',monospace;font-size:14px">←</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#e0e0e0">${habitPastDate}</span>
        <button onclick="habitPastNav(1)" style="padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:${canNext?'rgba(255,255,255,.05)':'transparent'};color:${canNext?'#e0e0e0':'#333'};cursor:${canNext?'pointer':'default'};font-family:'JetBrains Mono',monospace;font-size:14px">→</button>
      </div>
      ${habitData.habits.length === 0 ? '<div style="font-size:13px;color:#555;text-align:center;padding:12px 0">No habits to edit</div>' : ''}`;
    for (const h of habitData.habits) {
      const checked = !!habitPastChecked[h.id];
      const isDo = h.type === 'do';
      let checkBg, checkColor, checkText, rowBorder;
      if (isDo) {
        if (checked) { checkBg='#00e676'; checkColor='#0a0a0f'; checkText='✓'; rowBorder='rgba(0,230,118,.2)'; }
        else         { checkBg='rgba(255,255,255,.05)'; checkColor='#444'; checkText=''; rowBorder='rgba(255,255,255,.06)'; }
      } else {
        if (checked) { checkBg='#ff1744'; checkColor='#fff'; checkText='✗'; rowBorder='rgba(255,23,68,.25)'; }
        else         { checkBg='rgba(0,230,118,.07)'; checkColor='#00e676'; checkText='·'; rowBorder='rgba(0,230,118,.1)'; }
      }
      html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid ${rowBorder};margin-bottom:8px;cursor:pointer" onclick="habitPastToggle('${esc(h.id)}')">
        <div style="width:28px;height:28px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:${checkBg};color:${checkColor};border:1px solid ${rowBorder};user-select:none;-webkit-user-select:none">${checkText}</div>
        <span style="font-size:13px;font-weight:500;color:#e0e0e0">${esc(h.name)}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:4px;background:${isDo?'rgba(0,176,255,.1)':'rgba(255,165,0,.1)'};color:${isDo?'#00b0ff':'#ffa040'};margin-left:auto">${isDo?'DO':"DON'T"}</span>
      </div>`;
    }
    html += `<div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="habitSavePastDay()" style="flex:1;padding:9px;border-radius:8px;border:none;background:rgba(0,230,118,.15);color:#00e676;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px">SAVE CHANGES</button>
        <button onclick="habitShowPast=false;renderHabits()" style="padding:9px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#888;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer">Cancel</button>
      </div>
    </div>`;
  }

  // ── Transaction log ──
  if (habitData.log.length) {
    html += `<div class="log-header" style="margin:20px 0 10px">
      <span class="habit-section-hd" style="margin:0">Transaction Log</span>
      <button class="clear-btn" style="background:rgba(0,176,255,.1);border-color:rgba(0,176,255,.3);color:#00b0ff" onclick="exportHabitLog()">Export CSV</button>
    </div>`;
    // Group by date for readability
    let lastLogDate = '';
    for (const entry of habitData.log.slice(0, 60)) {
      if (entry.date !== lastLogDate) {
        if (lastLogDate) html += `<div style="height:6px"></div>`;
        html += `<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#444;margin-bottom:4px;letter-spacing:.5px">${entry.date}</div>`;
        lastLogDate = entry.date;
      }
      const dc = entry.delta > 0 ? '#00e676' : entry.delta < 0 ? '#ff1744' : '#555';
      const dt = entry.delta > 0 ? '+'+fmtMoney(entry.delta) : entry.delta < 0 ? fmtMoney(entry.delta) : '—';
      const eTimes = entry.times && entry.times.length
        ? `<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;margin-top:3px">🕐 ${entry.times.map(esc).join(' · ')}</div>`
        : '';
      html += `<div class="habit-log-row" style="border-left-color:${dc}">
        <div style="min-width:0"><div style="font-size:12px;color:#888">${esc(entry.reason)}</div>${eTimes}</div>
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:${dc};white-space:nowrap">${dt}</span>
      </div>`;
    }
    if (habitData.log.length > 60) {
      html += `<div style="text-align:center;font-size:11px;color:#444;font-family:'JetBrains Mono',monospace;padding:8px 0">${habitData.log.length - 60} older entries — export CSV for full history</div>`;
    }
  }

  el.innerHTML = html;
}


// ── Init ──
data = loadData();
if (!data.activeId) data.activeId = data.trackers[0].id;
saveData();
loadHabits();
renderAll();

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
