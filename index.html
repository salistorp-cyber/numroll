<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NumRoll">
<meta name="theme-color" content="#0a0a0f">
<title>NumRoll</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:'Outfit',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
html,body{
  background:#0a0a0f;
  color:#e0e0e0;
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
body{
  max-width:480px;
  margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0);
  background:linear-gradient(145deg,#0a0a0f 0%,#12121f 50%,#0d0d18 100%);
}
.mono{font-family:'JetBrains Mono',monospace}

/* header */
.header{display:flex;justify-content:space-between;align-items:center;padding:max(16px,calc(env(safe-area-inset-top,0px) + 12px)) 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:18px;letter-spacing:3px;background:linear-gradient(135deg,#00e676,#00b0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:4px}
.nav button{background:rgba(255,255,255,.05);border:none;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;transition:all .2s}
.nav button.active{background:rgba(0,230,118,.15);box-shadow:0 0 12px rgba(0,230,118,.2)}

/* switcher */
.switcher-bar{padding:8px 20px}
.switcher-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;transition:all .2s}
.switcher-dot{width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 6px rgba(0,230,118,.5);flex-shrink:0}
.switcher-name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switcher-arrow{font-size:10px;color:#666}

/* picker overlay */
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:100px}
.picker-panel{width:90%;max-width:400px;background:#16162a;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;max-height:60vh;overflow-y:auto}
.picker-header{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#888;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
.picker-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.picker-row.active{background:rgba(0,230,118,.05);border-radius:8px;padding:4px 8px;margin:0 -8px}
.picker-name-btn{flex:1;background:none;border:none;color:#ddd;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;text-align:left;cursor:pointer;padding:8px 4px;display:flex;align-items:center;gap:8px}
.active-mark{color:#00e676;font-size:10px}
.picker-count{margin-left:auto;font-size:11px;color:#555;font-family:'JetBrains Mono',monospace}
.picker-action{background:none;border:none;font-size:14px;cursor:pointer;padding:6px 4px;opacity:.5;transition:opacity .2s}
.picker-action:hover{opacity:1}
.add-tracker-btn{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px dashed rgba(0,230,118,.3);background:rgba(0,230,118,.05);color:#00e676;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px}
.rename-row,.new-input-row{display:flex;gap:6px;flex:1;align-items:center;padding:4px 0}
.new-input-row{margin-top:10px}
.rename-input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid rgba(0,230,118,.3);background:rgba(0,0,0,.3);color:#fff;font-size:14px;font-family:'Outfit',sans-serif;outline:none}
.rename-save{background:rgba(0,230,118,.2);border:none;color:#00e676;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px}
.rename-cancel{background:rgba(255,255,255,.05);border:none;color:#888;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:14px}
.delete-confirm{display:flex;gap:8px;flex:1;align-items:center;padding:6px 0}
.delete-text{flex:1;font-size:13px;color:#ff1744;font-weight:500}
.delete-yes{background:rgba(255,23,68,.2);border:none;color:#ff1744;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.delete-no{background:rgba(255,255,255,.05);border:none;color:#888;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}

/* roll view */
.roll-view{padding:20px 20px 0;text-align:center}
.target-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.target-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:#888;font-weight:600}
.target-num{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:800;color:#fff}
.range-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:#555}

.roll-circle{
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#1a1a2e 0%,#0f0f1a 100%);
  border:2px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 24px;cursor:pointer;transition:all .3s ease;
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.05);
  user-select:none;-webkit-user-select:none;
}
.roll-circle.hit{border-color:#00e676;box-shadow:0 0 40px rgba(0,230,118,.25),inset 0 0 20px rgba(0,230,118,.05)}
.roll-circle.miss{border-color:#ff1744;box-shadow:0 0 40px rgba(255,23,68,.25),inset 0 0 20px rgba(255,23,68,.05)}
.roll-circle.spinning{animation:spin .6s cubic-bezier(.5,0,.5,1)}
.roll-number{font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:800;color:#fff;line-height:1}
.roll-instruction{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#555;margin-top:8px}

.result-badge{
  display:inline-block;padding:8px 20px;border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#000;margin-bottom:24px;
  animation:popIn .3s ease;
}

.quick-stats{display:flex;justify-content:center;gap:32px;margin-bottom:20px}
.qs-item{text-align:center}
.qs-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:#fff}
.qs-label{font-size:11px;color:#666;letter-spacing:1px;margin-top:2px}

.adjust-info{
  font-size:12px;color:#555;padding:12px 16px;
  background:rgba(255,255,255,.03);border-radius:8px;
  font-family:'JetBrains Mono',monospace;
}

/* history */
.hist-view{padding:16px 20px}
.period-tabs{display:flex;gap:6px;margin-bottom:20px}
.period-btn{flex:1;padding:8px 0;border:1px solid rgba(255,255,255,.08);background:transparent;color:#888;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s}
.period-btn.active{background:rgba(0,230,118,.12);color:#00e676;border-color:rgba(0,230,118,.3)}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:rgba(255,255,255,.03);border-radius:10px;padding:14px 12px;text-align:center;border:1px solid rgba(255,255,255,.04)}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:800;color:#fff}
.stat-lbl{font-size:11px;color:#666;margin-top:4px;letter-spacing:1px}

.bar-viz{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:20px;background:rgba(255,255,255,.03)}
.bar-viz .bar{height:100%;transition:width .4s ease}

.log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#888;letter-spacing:1px}
.clear-btn{background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.3);color:#ff1744;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.log-list{max-height:340px;overflow-y:auto}
.empty-log{text-align:center;color:#444;padding:30px;font-family:'JetBrains Mono',monospace;font-size:13px}
.log-row{padding:10px 12px;margin-bottom:6px;background:rgba(255,255,255,.02);border-radius:8px}
.log-main{display:flex;align-items:center;gap:8px}
.log-result{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800}
.log-vs{font-size:11px;color:#555}
.log-target{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#888}
.log-badge{margin-left:auto;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px}
.log-time{font-size:10px;color:#444;margin-top:4px}

/* settings */
.settings-view{padding:20px}
.settings-title{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;margin-bottom:20px;letter-spacing:1px;color:#fff}
.sub-title{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;margin-bottom:14px;color:#00e676;letter-spacing:1px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#888;margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.field input[type=number]{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-size:16px;font-family:'JetBrains Mono',monospace;outline:none}
.target-control{display:flex;gap:8px;align-items:center}
.target-control input{text-align:center;flex:1}
.pm-btn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:22px;cursor:pointer;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center}
.toggle-row{display:flex;gap:8px}
.toggle-btn{flex:1;padding:10px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:transparent;color:#888;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s}
.toggle-btn.active{background:rgba(0,230,118,.12);color:#00e676;border-color:rgba(0,230,118,.3)}
.divider{height:1px;background:rgba(255,255,255,.06);margin:20px 0}
.reset-btn{width:100%;padding:12px;border-radius:8px;border:none;background:rgba(0,176,255,.15);color:#00b0ff;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;margin-bottom:8px}
.reset-btn.danger{background:rgba(255,23,68,.15);color:#ff1744}
.install-note{margin-top:24px;padding:14px 16px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:12px;color:#888;line-height:1.6;font-family:'JetBrains Mono',monospace}

/* habits */
.habits-view{padding:16px 20px}
.balance-card{text-align:center;padding:22px 20px 14px;background:rgba(255,255,255,.03);border-radius:14px;border:1px solid rgba(255,255,255,.06);margin-bottom:20px;transition:border-color .2s}
.balance-card:hover{border-color:rgba(255,255,255,.12)}
.balance-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:#555;margin-bottom:8px}
.balance-amt{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:800;line-height:1}
.balance-today{font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:8px}
.habit-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:8px;transition:all .15s}
.habit-check{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.habit-del{background:none;border:none;cursor:pointer;font-size:14px;opacity:.2;transition:opacity .2s;padding:4px;color:#fff;flex-shrink:0}
.habit-del:hover{opacity:.8}
.habit-section-hd{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:#555;font-weight:700;margin:20px 0 10px;text-transform:uppercase}
.habit-log-row{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.02);margin-bottom:5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-left:3px solid transparent}

/* mandarin */
.man-view{padding:16px 20px}
.man-import-area{width:100%;min-height:110px;font-size:12px;font-family:'JetBrains Mono',monospace;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#e0e0e0;resize:vertical;box-sizing:border-box;outline:none}
.man-toast{position:fixed;top:72px;right:16px;background:rgba(0,230,118,.15);color:#00e676;font-size:12px;padding:6px 14px;border-radius:8px;border:1px solid rgba(0,230,118,.3);z-index:200;pointer-events:none;font-family:'JetBrains Mono',monospace}

.hidden{display:none!important}

@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">NUMROLL</div>
  <div class="nav">
    <button id="nav-roll" class="active" onclick="switchView('roll')">🎲</button>
    <button id="nav-history" onclick="switchView('history')">📊</button>
    <button id="nav-mandarin" onclick="switchView('mandarin')" title="Mandarin">🀄</button>
    <button id="nav-habits" onclick="switchView('habits')" title="Habit $">💰</button>
    <button id="nav-settings" onclick="switchView('settings')">⚙️</button>
  </div>
</div>

<div class="switcher-bar">
  <button class="switcher-btn" onclick="togglePicker()">
    <span class="switcher-dot"></span>
    <span class="switcher-name" id="switcher-name">My Tracker</span>
    <span class="switcher-arrow" id="switcher-arrow">▼</span>
  </button>
</div>

<div id="picker-overlay" class="picker-overlay hidden" onclick="closePicker()">
  <div class="picker-panel" onclick="event.stopPropagation()">
    <div class="picker-header">Your Trackers</div>
    <div id="picker-list"></div>
    <div id="new-input-row" class="new-input-row hidden">
      <input id="new-name-input" class="rename-input" placeholder="Tracker name…"
        onkeydown="if(event.key==='Enter')confirmNewTracker()">
      <button class="rename-save" onclick="confirmNewTracker()">✓</button>
      <button class="rename-cancel" onclick="cancelNewTracker()">✕</button>
    </div>
    <button id="add-tracker-btn" class="add-tracker-btn" onclick="showNewTrackerInput()">+ New Tracker</button>
  </div>
</div>

<div id="man-picker-overlay" class="picker-overlay hidden" onclick="closeManPicker()">
  <div class="picker-panel" onclick="event.stopPropagation()">
    <div class="picker-header">Select Week</div>
    <div id="man-picker-list"></div>
  </div>
</div>

<!-- ROLL VIEW -->
<div id="view-roll" class="roll-view">
  <div class="target-bar">
    <span class="target-label">TARGET</span>
    <span class="target-num" id="target-num">50</span>
    <span class="range-label" id="range-label">1–100</span>
  </div>
  <div class="roll-circle" id="roll-circle" onclick="doRoll()">
    <div class="roll-number" id="roll-number">?</div>
    <div class="roll-instruction" id="roll-instruction">TAP TO ROLL</div>
  </div>
  <div id="result-badge" class="result-badge hidden"></div>
  <div class="quick-stats">
    <div class="qs-item"><div class="qs-val" id="qs-total">0</div><div class="qs-label">Rolls</div></div>
    <div class="qs-item"><div class="qs-val" id="qs-hits">0</div><div class="qs-label">Hits</div></div>
    <div class="qs-item"><div class="qs-val" id="qs-rate">0%</div><div class="qs-label">Rate</div></div>
  </div>
  <div class="adjust-info" id="adjust-info"></div>
</div>

<!-- HISTORY VIEW -->
<div id="view-history" class="hist-view hidden">
  <div class="period-tabs" id="period-tabs"></div>
  <div class="stats-grid" id="stats-grid"></div>
  <div class="bar-viz" id="bar-viz"></div>
  <div class="log-header">
    <span>Roll Log</span>
    <div style="display:flex;gap:6px">
      <button class="clear-btn" style="background:rgba(0,176,255,.1);border-color:rgba(0,176,255,.3);color:#00b0ff" onclick="exportHistory()">Export CSV</button>
      <button class="clear-btn" onclick="clearHistory()">Clear All</button>
    </div>
  </div>
  <div class="log-list" id="log-list"></div>
</div>

<!-- SETTINGS VIEW -->
<div id="view-settings" class="settings-view hidden"></div>

<!-- HABITS VIEW -->
<div id="view-habits" class="habits-view hidden"></div>

<!-- MANDARIN VIEW -->
<div id="view-mandarin" class="man-view hidden"></div>
<div id="man-toast" class="man-toast hidden"></div>

<script>
// ── State ──
const STORAGE_KEY = "numroll-data-v2";
const DEFAULT_CFG = { target:50, min:1, max:100, direction:"up", adjustAmount:1, rollsBeforeRaise:1 };

let data = { trackers: [], activeId: null };
let currentView = "roll";
let statsPeriod = "day";
let rolling = false;
let lastRoll = null;
let showResult = false;
let animInterval = null;

// ── Helpers ──
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const startOfWeek = d => { const s = startOfDay(d); s.setDate(s.getDate()-s.getDay()); return s; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);

function filterByPeriod(rolls, period) {
  if (period==="all") return rolls;
  const n = new Date();
  let cutoff;
  if (period==="day") cutoff=startOfDay(n);
  else if (period==="week") cutoff=startOfWeek(n);
  else cutoff=startOfMonth(n);
  return rolls.filter(r => new Date(r.ts)>=cutoff);
}

function getStats(rolls) {
  if (!rolls.length) return {total:0,hits:0,misses:0,rate:0};
  const hits = rolls.filter(r=>r.hit).length;
  return {total:rolls.length, hits, misses:rolls.length-hits, rate:Math.round(hits/rolls.length*100)};
}

function secureRandom(min,max) {
  const range=max-min+1, limit=Math.floor(0x100000000/range)*range;
  let raw;
  do { raw=crypto.getRandomValues(new Uint32Array(1))[0]; } while(raw>=limit);
  return min+(raw%range);
}

function makeTracker(name) {
  return { id:uid(), name, cfg:{...DEFAULT_CFG}, history:[] };
}

// ── Storage ──
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.trackers && d.trackers.length) return d; }
  } catch(e) {}
  const init = { trackers:[makeTracker("My Tracker")], activeId:null };
  init.activeId = init.trackers[0].id;
  return init;
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

// ── Active tracker ──
function tracker() { return data.trackers.find(t=>t.id===data.activeId) || data.trackers[0]; }
function cfg() { return tracker()?.cfg || DEFAULT_CFG; }
function history() { return tracker()?.history || []; }

// ── View switching ──
function switchView(v) {
  currentView = v;
  closePicker();
  closeManPicker();
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  document.getElementById('view-roll').classList.toggle('hidden', v!=='roll');
  document.getElementById('view-history').classList.toggle('hidden', v!=='history');
  document.getElementById('view-settings').classList.toggle('hidden', v!=='settings');
  document.getElementById('view-habits').classList.toggle('hidden', v!=='habits');
  document.getElementById('view-mandarin').classList.toggle('hidden', v!=='mandarin');
  updateSwitcherBar(v);
  if (v==='roll') renderRoll();
  else if (v==='history') renderHistory();
  else if (v==='settings') renderSettings();
  else if (v==='habits') renderHabits();
  else if (v==='mandarin') renderMandarin();
}

// ── Picker ──
function togglePicker() {
  const el = document.getElementById('picker-overlay');
  el.classList.toggle('hidden');
  document.getElementById('switcher-arrow').textContent = el.classList.contains('hidden') ? '▼' : '▲';
  if (!el.classList.contains('hidden')) renderPicker();
}
function closePicker() {
  document.getElementById('picker-overlay').classList.add('hidden');
  document.getElementById('switcher-arrow').textContent = '▼';
}

function renderPicker() {
  const list = document.getElementById('picker-list');
  list.innerHTML = data.trackers.map(t => `
    <div class="picker-row ${t.id===data.activeId?'active':''}">
      <button class="picker-name-btn" data-id="${t.id}" data-action="switch">
        ${t.id===data.activeId?'<span class="active-mark">●</span>':''}
        ${esc(t.name)}
        <span class="picker-count">${t.history.length} rolls</span>

      <button class="picker-action" data-id="${t.id}" data-action="delete" title="Delete">🗑️</button>

// ── Rolling ──
function doRoll() {
  if (rolling) return;
  const c = cfg();
  showResult = false;
  rolling = true;
  const circle = document.getElementById('roll-circle');
  circle.className = 'roll-circle spinning';
  document.getElementById('roll-instruction').textContent = 'ROLLING…';
  document.getElementById('result-badge').classList.add('hidden');

  animInterval = setInterval(() => {
    document.getElementById('roll-number').textContent = Math.floor(Math.random() * (c.max - c.min + 1)) + c.min;
  }, 50);

  setTimeout(() => {
    clearInterval(animInterval);
    const result = secureRandom(c.min, c.max);
    const hit = result >= c.target;
    const entry = { result, target:c.target, hit, ts:new Date().toISOString() };
    tracker().history.unshift(entry);
    lastRoll = entry;
    rolling = false;
    showResult = true;
    saveData();
    renderRoll();

    // check adjust
    const newTarget = checkAdjust(tracker().history, c);
    if (newTarget !== c.target) {
      setTimeout(() => { tracker().cfg.target = newTarget; saveData(); renderRoll(); }, 800);
    }
  }, 600);
}

function checkAdjust(rolls, c) {
  const n = c.rollsBeforeRaise ?? 1;
  const recent = rolls.filter(r => r.target === c.target).slice(0, n);
  if (recent.length < n) return c.target;
  if (recent.every(r => r.hit)) {
    return c.direction==="up" ? Math.min(c.max, c.target+c.adjustAmount) : Math.max(c.min, c.target-c.adjustAmount);
  }
  return c.target;
}

// ── Habit $ Tracker ──
const HABIT_KEY = "numroll-habits-v1";
const HABIT_LOG_DAYS   = 365; // 1 year — ~150 KB max, trivial
const HABIT_DAILY_DAYS = 90;  // keep per-day check states for 90 days (past editing)

let habitData = { habits:[], initialBalance:0, todayChecked:{}, lastDate:'', log:[], dailyChecked:{} };
let habitShowAdd     = false;
let habitFormType    = 'do';
let habitEditBalance = false;
let habitShowPast    = false;
let habitPastDate    = '';
let habitPastChecked = {};

function fmtMoney(n) { return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2); }
function habitTodayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// Balance is always computed from initialBalance + log sum so past edits propagate correctly
function habitBalance() {
  let b = habitData.initialBalance || 0;
  for (const e of habitData.log) b += (e.delta || 0);
  return Math.round(b * 100) / 100;
}

function loadHabits() {
  try {
    const r = localStorage.getItem(HABIT_KEY);
    if (r) {
      const d = JSON.parse(r);
      habitData = { ...habitData, ...d };
      // Migrate: old data stored running total in 'balance', no 'initialBalance'
      if (typeof habitData.initialBalance === 'undefined') {
        let logSum = 0;
        for (const e of habitData.log) logSum += (e.delta || 0);
        habitData.initialBalance = Math.round(((habitData.balance || 0) - logSum) * 100) / 100;
      }
      if (!habitData.dailyChecked) habitData.dailyChecked = {};
    }
  } catch {}
  processHabitRollover();
}

function saveHabits() {
  try { localStorage.setItem(HABIT_KEY, JSON.stringify(habitData)); } catch {}
}

// Generate log entries for one day given a checked-state map
function habitDayEntries(date, checked) {
  const entries = [];
  for (const h of habitData.habits) {
    const done = !!checked[h.id];
    let delta = 0, reason = '';
    if (h.type === 'do') {
      reason = done ? `✓ Done: ${h.name}` : `✗ Missed: ${h.name}`;
      if (!done) delta = -h.amount;
    } else {
      reason = done ? `✗ Broke: ${h.name}` : `✓ Kept: ${h.name}`;
      delta = done ? -h.amount : +h.amount;
    }
    entries.push({ date, reason, delta });
  }
  return entries;
}

function habitTrimLog() {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - HABIT_LOG_DAYS);
  const cs = cutoff.toISOString().slice(0,10);
  habitData.log = habitData.log.filter(e => e.date >= cs);
  const dc = new Date(); dc.setDate(dc.getDate() - HABIT_DAILY_DAYS);
  const ds = dc.toISOString().slice(0,10);
  Object.keys(habitData.dailyChecked).forEach(d => { if (d < ds) delete habitData.dailyChecked[d]; });
}

function processHabitRollover() {
  const today = habitTodayStr();
  if (habitData.lastDate === today) return;

  if (habitData.lastDate && habitData.habits.length) {
    // Build ordered list: lastDate first, then any gap days up to yesterday
    const datesToProcess = [];
    let cursor = new Date(habitData.lastDate);
    const todayDate = new Date(today);
    while (cursor < todayDate) {
      datesToProcess.push(cursor.toISOString().slice(0,10));
      cursor.setDate(cursor.getDate() + 1);
    }
    // Process each: lastDate uses todayChecked, gap days use {} (missed)
    for (const date of datesToProcess) {
      const checked = date === habitData.lastDate ? habitData.todayChecked : {};
      habitData.dailyChecked[date] = { ...checked };
      const entries = habitDayEntries(date, checked);
      // Insert before existing entries for the same date, newest date first
      habitData.log.unshift(...entries.reverse()); // reverse so they unshift in correct order
    }
  }

  habitTrimLog();
  habitData.todayChecked = {};
  habitData.lastDate = today;
  saveHabits();
}

function habitTodayDelta() {
  let d = 0;
  for (const h of habitData.habits) {
    const checked = !!habitData.todayChecked[h.id];
    if      (h.type==='do'   && !checked) d -= h.amount;
    else if (h.type==='dont' &&  checked) d -= h.amount;
    else if (h.type==='dont' && !checked) d += h.amount;
  }
  return Math.round(d * 100) / 100;
}

function habitToggle(id) { habitData.todayChecked[id]=!habitData.todayChecked[id]; saveHabits(); renderHabits(); }

function habitDelete(id) {
  const row = document.getElementById('hrow-'+id);
  if (row && !row.dataset.confirmDelete) {
    row.dataset.confirmDelete = '1';
    const del = row.querySelector('.habit-del');
    if (del) { del.textContent='Confirm?'; del.style.opacity='1'; del.style.color='#ff1744'; }
    setTimeout(() => { if(row){delete row.dataset.confirmDelete;} if(del){del.textContent='🗑️';del.style.opacity='.2';del.style.color='#fff';} }, 2000);
    return;
  }
  habitData.habits = habitData.habits.filter(h=>h.id!==id);
  delete habitData.todayChecked[id];
  saveHabits(); renderHabits();
}

// Past-day editing
function habitOpenPast() {
  habitShowPast = true;
  const d = new Date(); d.setDate(d.getDate()-1);
  habitPastDate = d.toISOString().slice(0,10);
  habitPastChecked = { ...(habitData.dailyChecked[habitPastDate] || {}) };
  renderHabits();
}
function habitPastNav(offset) {
  const d = new Date(habitPastDate); d.setDate(d.getDate()+offset);
  const s = d.toISOString().slice(0,10);
  const min = new Date(); min.setDate(min.getDate()-HABIT_DAILY_DAYS);
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if (s < min.toISOString().slice(0,10) || s > yesterday.toISOString().slice(0,10)) return;
  habitPastDate = s;
  habitPastChecked = { ...(habitData.dailyChecked[habitPastDate] || {}) };
  renderHabits();
}
function habitPastToggle(id) { habitPastChecked[id]=!habitPastChecked[id]; renderHabits(); }
function habitSavePastDay() {
  // Remove old log entries for this date, insert fresh ones
  habitData.log = habitData.log.filter(e => e.date !== habitPastDate);
  const entries = habitDayEntries(habitPastDate, habitPastChecked);
  habitData.log.push(...entries);
  habitData.log.sort((a,b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  habitTrimLog();
  habitData.dailyChecked[habitPastDate] = { ...habitPastChecked };
  habitShowPast = false;
  saveHabits(); renderHabits();
}

function exportHabitLog() {
  if (!habitData.log.length) return;
  const header = 'date,delta,reason\n';
  const body = habitData.log
    .map(e => `${e.date},${(e.delta||0).toFixed(2)},"${(e.reason||'').replace(/"/g,'""')}"`)
    .join('\n');
  const blob = new Blob([header+body], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `numroll_habits_${habitTodayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ── Mandarin Tracker ──
const MAN_WEEKS_KEY = "mandarin-weeks-v1";
const MAN_PROG_KEY  = "mandarin-prog-v1";
let manWeeks = [];
let manWeekIdx = 0;
let manChecked = {};
let manShowImport = false;
let manImportText = "";
let manTab = "tracker";
let manToastTimer = null;

const MAN_PHASES_OVERVIEW = [
  { label:"Phase 1", months:"Months 1–3",  bg:"rgba(30,80,160,.25)",  color:"#6ab0ff", title:"Foundations",      desc:"Pinyin · 4 tones · 200 words · 50 characters",         milestone:"HSK 1 mock · Introduce yourself in Mandarin" },
  { label:"Phase 2", months:"Months 4–6",  bg:"rgba(20,100,80,.25)",  color:"#4ddb9e", title:"Core building",    desc:"Grammar patterns · 500 words · 150 characters",        milestone:"HSK 2 mock · First iTalki session · Basic small talk" },
  { label:"Phase 3", months:"Months 7–12", bg:"rgba(120,80,20,.25)",  color:"#f0a850", title:"Intermediate",     desc:"Business vocab · 900 words · 350 characters",          milestone:"HSK 3 mock · Participate in business calls" },
  { label:"Phase 4", months:"Months 13–24",bg:"rgba(140,50,80,.25)",  color:"#f08aaa", title:"Business fluency", desc:"Professional Mandarin · 2500 words · 800+ characters",  milestone:"HSK 4 exam · Lead a full meeting in Mandarin" },
];

function manWeekPhase(w) {
  if (w <= 12) return { bg:"rgba(30,80,160,.25)",  color:"#6ab0ff", label:"Phase 1 · Foundations" };
  if (w <= 24) return { bg:"rgba(20,100,80,.25)",  color:"#4ddb9e", label:"Phase 2 · Core building" };
  if (w <= 48) return { bg:"rgba(120,80,20,.25)",  color:"#f0a850", label:"Phase 3 · Intermediate" };
  return              { bg:"rgba(140,50,80,.25)",  color:"#f08aaa", label:"Phase 4 · Business fluency" };
}

function loadMandarin() {
  try { const r = localStorage.getItem(MAN_WEEKS_KEY); if (r) manWeeks = JSON.parse(r); } catch {}
  try {
    const r = localStorage.getItem(MAN_PROG_KEY);
    if (r) { const p = JSON.parse(r); manChecked = p.checked||{}; manWeekIdx = p.weekIdx||0; }
  } catch {}
  fetch('./weeks.json?_=' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(arr => {
      if (!arr) return;
      manMergeWeeks(Array.isArray(arr) ? arr : [arr]);
      if (currentView === 'mandarin') { renderMandarin(); updateSwitcherBar('mandarin'); }
    })
    .catch(() => {});
}

function manSaveWeeks() {
  try { localStorage.setItem(MAN_WEEKS_KEY, JSON.stringify(manWeeks)); } catch {}
}

function manSaveProgress() {
  try { localStorage.setItem(MAN_PROG_KEY, JSON.stringify({ checked: manChecked, weekIdx: manWeekIdx })); } catch {}
}

function manMergeWeeks(arr) {
  for (const w of arr) {
    const i = manWeeks.findIndex(x => x.week === w.week);
    if (i >= 0) manWeeks[i] = w; else manWeeks.push(w);
  }
  manWeeks.sort((a, b) => a.week - b.week);
  manSaveWeeks();
}

function manFlash(msg) {
  clearTimeout(manToastTimer);
  const el = document.getElementById('man-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('hidden');
  manToastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}

function manToggleTask(id) { manChecked[id] = !manChecked[id]; manSaveProgress(); renderMandarin(); }
function manGoWeek(i)      { manWeekIdx = i; manSaveProgress(); renderMandarin(); if (currentView === 'mandarin') updateSwitcherBar('mandarin'); }
function manSetTab(t)      { manTab = t; renderMandarin(); }
function manToggleImport() { manShowImport = !manShowImport; renderMandarin(); }

function manDoImport() {
  const ta = document.getElementById('man-import-ta');
  const text = ta ? ta.value : manImportText;
  try {
    const raw = JSON.parse(text.trim());
    manMergeWeeks(Array.isArray(raw) ? raw : [raw]);
    manImportText = "";
    manShowImport = false;
    renderMandarin();
    manFlash("Imported successfully!");
  } catch {
    const errEl = document.getElementById('man-import-err');
    if (errEl) errEl.textContent = "Invalid JSON — check the format and try again.";
  }
}

function manHandleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      manMergeWeeks(Array.isArray(parsed) ? parsed : [parsed]);
      manShowImport = false;
      renderMandarin();
      manFlash("File imported successfully!");
    } catch {
      const errEl = document.getElementById('man-import-err');
      if (errEl) errEl.textContent = "Invalid JSON file.";
    }
  };
  reader.readAsText(file);
}

function renderMandarin() {
  const el = document.getElementById('view-mandarin');
  if (!el) return;
  const cw    = manWeeks[manWeekIdx] || null;
  const tasks = cw?.tasks || [];
  const done  = tasks.filter(t => manChecked[t.id]).length;
  const pct   = tasks.length ? Math.round(done / tasks.length * 100) : 0;
  const allDone = tasks.length > 0 && done === tasks.length;

  const tabBtn = (id, label) => `<button onclick="manSetTab('${id}')" style="padding:6px 16px;font-size:13px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid ${manTab===id?'#e0e0e0':'rgba(255,255,255,.1)'};background:${manTab===id?'#e0e0e0':'transparent'};color:${manTab===id?'#0a0a0f':'#888'};transition:all .2s">${label}</button>`;

    html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;background:rgba(255,255,255,.03);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.5rem;border:1px solid rgba(255,255,255,.06)">`;
    for (const [l,v] of [["Goal","Business & career"],["Daily","15–30 min"],["Timeline","1–2 years"],["Target","HSK 4–5 / B1"],["Languages","EN + RU"]]) {
      html += `<div><div style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">${l}</div><div style="font-size:13px;font-weight:500;color:#e0e0e0">${v}</div></div>`;

    html += `</div>`;
    for (const p of MAN_PHASES_OVERVIEW) {
      html += `<div style="border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1rem 1.25rem;margin-bottom:.75rem"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:500;padding:2px 10px;border-radius:20px;background:${p.bg};color:${p.color}">${p.label}</span><span style="font-size:12px;color:#555">${p.months}</span></div><div style="font-size:14px;font-weight:500;margin-bottom:4px;color:#e0e0e0">${p.title}</div><div style="font-size:13px;color:#888;margin-bottom:10px">${p.desc}</div><div style="font-size:12px;color:#555;border-top:1px solid rgba(255,255,255,.06);padding-top:8px">🎯 ${p.milestone}</div></div>`;

    html += `<div style="margin-top:1rem;padding:12px 16px;border-radius:8px;background:rgba(255,255,255,.03);font-size:13px;color:#888;line-height:1.6;border:1px solid rgba(255,255,255,.06)"><strong style="color:#e0e0e0;font-weight:500">Key habit:</strong> 15–30 min every day beats 3 hours once a week. Track each week in the Weekly tracker tab.</div>`;
  } else {
    // tracker tab
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><div style="font-size:14px;font-weight:500;color:#e0e0e0">${cw ? `Week ${cw.week}: ${esc(cw.title||'')}` : "No weeks loaded yet"}</div><button onclick="manToggleImport()" style="font-size:12px;padding:5px 14px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,.1);background:transparent;color:#888">${manShowImport ? "✕ Close" : "+ Import weeks"}</button></div>`;

    if (manShowImport) {
      html += `<div style="margin-bottom:1rem;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1rem;background:rgba(255,255,255,.03)"><div style="font-size:13px;font-weight:500;margin-bottom:6px;color:#e0e0e0">Import weeks JSON</div><div style="font-size:12px;color:#555;margin-bottom:8px">Paste JSON or upload a .json file. One week or an array of weeks — existing weeks are updated in place. You can also commit weeks.json to the repo and it loads automatically.</div><textarea id="man-import-ta" class="man-import-area" placeholder='{"week":1,"title":"Pinyin Foundations","tasks":[...]}'>${esc(manImportText)}</textarea><div id="man-import-err" style="font-size:12px;color:#ff1744;margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center"><button onclick="manDoImport()" style="padding:7px 20px;font-size:13px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:none;background:#e0e0e0;color:#0a0a0f">Import JSON</button><label style="padding:7px 20px;font-size:13px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,.1);background:transparent;color:#888;white-space:nowrap">Upload file<input type="file" accept=".json" style="display:none" onchange="manHandleFile(this)"></label><button onclick="manToggleImport()" style="padding:7px 16px;font-size:13px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,.1);background:transparent;color:#888">Cancel</button></div></div>`;
    }

    if (manWeeks.length === 0) {
      html += `<div style="text-align:center;padding:3rem 2rem;border:1px dashed rgba(255,255,255,.1);border-radius:12px"><div style="font-size:32px;margin-bottom:.75rem">📋</div><div style="font-size:14px;font-weight:500;margin-bottom:6px;color:#e0e0e0">No weeks loaded yet</div><div style="font-size:13px;color:#888;margin-bottom:1.5rem">Paste JSON, upload a file, or commit weeks.json to the repo — the app fetches it automatically.</div><button onclick="manToggleImport()" style="padding:8px 22px;font-size:13px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e0e0e0">Import first week →</button></div>`;
    } else {
      // week pills
      html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem">`;
      for (let i = 0; i < manWeeks.length; i++) {
        const w = manWeeks[i];
        const ph = manWeekPhase(w.week);
        const wDone = w.tasks && w.tasks.length && w.tasks.every(t => manChecked[t.id]);
        const isAct = i === manWeekIdx;
        html += `<button onclick="manGoWeek(${i})" style="padding:4px 12px;font-size:12px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;background:${isAct?ph.bg:'transparent'};color:${isAct?ph.color:'#888'};border:1px solid ${isAct?ph.color:'rgba(255,255,255,.08)'};font-weight:${isAct?'500':'400'}">W${w.week}${wDone?' ✓':''}</button>`;
      }
      html += `</div>`;

      if (cw) {
        const ph = manWeekPhase(cw.week);
        html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap"><span style="font-size:11px;font-weight:500;padding:2px 10px;border-radius:20px;background:${ph.bg};color:${ph.color}">${ph.label}</span>${cw.subtitle?`<span style="font-size:12px;color:#555">${esc(cw.subtitle)}</span>`:''}</div>`;
      }

      html += `<div style="margin-bottom:1.25rem"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:12px;color:#888">Progress this week</span><span style="font-size:12px;font-weight:500;color:${allDone?'#00e676':'#e0e0e0'}">${done}/${tasks.length}${allDone?' — Complete! 🎉':''}</span></div><div style="height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden"><div style="height:100%;border-radius:99px;width:${pct}%;transition:width .4s ease;background:${allDone?'#00e676':'#e0e0e0'}"></div></div></div>`;

      if (tasks.length) {
        html += `<div style="display:flex;flex-direction:column;gap:8px">`;
        for (const task of tasks) {
          const isDone = !!manChecked[task.id];
          html += `<div data-task-id="${esc(task.id)}" style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none;border:1px solid ${isDone?'rgba(255,255,255,.06)':'rgba(255,255,255,.1)'};background:${isDone?'rgba(255,255,255,.02)':'rgba(255,255,255,.04)'};transition:all .15s"><div style="width:18px;height:18px;border-radius:5px;flex-shrink:0;margin-top:2px;border:1.5px solid ${isDone?'#00e676':'rgba(255,255,255,.2)'};background:${isDone?'#00e676':'transparent'};display:flex;align-items:center;justify-content:center;transition:all .15s">${isDone?'<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">${task.day?`<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.04);color:#555;border:1px solid rgba(255,255,255,.06);font-weight:500">${esc(task.day)}</span>`:''}${task.tool?`<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(0,176,255,.1);color:#00b0ff">${esc(task.tool)}</span>`:''}<span style="font-size:13px;font-weight:500;text-decoration:${isDone?'line-through':'none'};color:${isDone?'#555':'#e0e0e0'};transition:all .15s">${esc(task.title||'')}</span></div>${task.desc?`<div style="font-size:12px;color:${isDone?'#444':'#888'};line-height:1.6">${esc(task.desc)}</div>`:''}</div></div>`;
        }
        html += `</div>`;
      }

      if (allDone && manWeekIdx < manWeeks.length - 1) {
        html += `<div style="margin-top:1rem;padding:12px 16px;border-radius:8px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span style="font-size:13px;color:#00e676">Great work! Ready for Week ${manWeeks[manWeekIdx+1]?.week}?</span><button onclick="manGoWeek(${manWeekIdx+1})" style="font-size:12px;padding:5px 16px;border-radius:20px;cursor:pointer;font-family:'Outfit',sans-serif;border:none;background:#00e676;color:#0a0a0f">Start Week ${manWeeks[manWeekIdx+1]?.week} →</button></div>`;
      }
      if (allDone && manWeekIdx === manWeeks.length - 1) {
        html += `<div style="margin-top:1rem;padding:12px 16px;border-radius:8px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);font-size:13px;color:#00e676">🎉 All loaded weeks complete! Import the next week's plan to continue.</div>`;
      }
    }
  }

  el.innerHTML = html;
}

// ── Init ──
data = loadData();
if (!data.activeId) data.activeId = data.trackers[0].id;
saveData();
loadHabits();
loadMandarin();
renderAll();

// Delegated click handler for mandarin task items (avoids XSS from user-supplied task IDs in onclick)
document.getElementById('view-mandarin').addEventListener('click', e => {
  const el = e.target.closest('[data-task-id]');
  if (el) manToggleTask(el.dataset.taskId);
});

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
